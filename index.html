
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>Rush AI</title>

<style>
:root {
  --bg: #080d18;
  --panel: #101827;
  --blue: #39a9ff;
  --text: #eef5ff;
  --muted: #8c9ab0;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #202b3d;
  background: #0b1220;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  background: linear-gradient(135deg, #39a9ff, #6557ff);
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 22px;
  color: white;
}

h1 { margin: 0; font-size: 20px; }
.subtitle { color: var(--muted); font-size: 12px; }

.status {
  margin-left: auto;
  color: #70e5ac;
  font-size: 12px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.welcome {
  text-align: center;
  margin: auto 0;
  padding: 20px 8px;
}
.welcome .big { font-size: 46px; }
.welcome h2 { margin-bottom: 8px; }
.welcome p { color: var(--muted); line-height: 1.6; }

.message {
  max-width: 88%;
  padding: 12px 15px;
  border-radius: 17px;
  line-height: 1.55;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.user {
  align-self: flex-end;
  background: #174d82;
  border-bottom-right-radius: 5px;
}
.ai {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid #202b3d;
  border-bottom-left-radius: 5px;
}
.name {
  font-size: 11px;
  color: #7dc7ff;
  margin-bottom: 5px;
  font-weight: 700;
}
.message button {
  background: transparent;
  color: #9bcfff;
  border: 0;
  padding: 8px 0 0;
  cursor: pointer;
}

#statusLine {
  min-height: 20px;
  padding: 0 16px 8px;
  color: var(--muted);
  font-size: 12px;
}

.composer {
  background: #0b1220;
  border-top: 1px solid #202b3d;
  padding: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
}
.row { display: flex; gap: 8px; align-items: center; }

#question {
  flex: 1;
  min-width: 0;
  resize: none;
  max-height: 120px;
  padding: 13px;
  border-radius: 15px;
  border: 1px solid #28354a;
  background: #111b2c;
  color: white;
  font: inherit;
  outline: none;
}
#question:focus { border-color: var(--blue); }

button {
  font: inherit;
  cursor: pointer;
}
.action {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border: 1px solid #28354a;
  border-radius: 14px;
  color: white;
  background: #152136;
  font-size: 19px;
}
#send {
  background: var(--blue);
  color: #04101d;
  border: 0;
  font-weight: 800;
}
#send:disabled { opacity: .5; }

.tools {
  display: flex;
  justify-content: space-between;
  margin-top: 9px;
  gap: 8px;
}
.small {
  background: transparent;
  color: var(--muted);
  border: 0;
  padding: 5px;
  font-size: 12px;
}
footer {
  text-align: center;
  padding: 0 8px 7px;
  color: #68768c;
  font-size: 10px;
}
</style>
</head>

<body>
<header>
  <div class="logo">R</div>
  <div>
    <h1>Rush AI</h1>
    <div class="subtitle">Your personal AI assistant</div>
  </div>
  <div class="status">● Ready</div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <div class="big">✦</div>
    <h2>Welcome to Rush AI</h2>
    <p>Ask me anything.<br>
    Type your question or tap the microphone to speak.</p>
  </div>
</main>

<div id="statusLine" role="status">Ready when you are.</div>

<section class="composer">
  <div class="row">
    <button class="action" id="mic" title="Voice input"
      aria-label="Voice input">🎙️</button>

    <textarea id="question" rows="1"
      placeholder="Message Rush AI..."
      aria-label="Your message"></textarea>

    <button class="action" id="send" aria-label="Send message">➤</button>
  </div>

  <div class="tools">
    <button class="small" id="voiceToggle">🔊 Voice replies: ON</button>
    <button class="small" id="stopVoice">■ Stop speaking</button>
    <button class="small" id="clear">Clear chat</button>
  </div>
</section>

<footer>
  Rush AI • AI answers may be incorrect • Internet required
</footer>

<script>
const API_BASE = "https://text.pollinations.ai/";

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const sendButton = document.getElementById("send");
const micButton = document.getElementById("mic");
const statusLine = document.getElementById("statusLine");
const welcome = document.getElementById("welcome");
const voiceToggle = document.getElementById("voiceToggle");

let busy = false;
let voiceReplies = true;
let history = [];

function setStatus(text) {
  statusLine.textContent = text;
}

function addMessage(role, text) {
  if (welcome) welcome.remove();

  const bubble = document.createElement("div");
  bubble.className = "message " + role;

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = role === "user" ? "YOU" : "RUSH AI";

  const content = document.createElement("div");
  content.textContent = text;

  bubble.appendChild(name);
  bubble.appendChild(content);

  if (role === "ai") {
    const speakButton = document.createElement("button");
    speakButton.textContent = "🔊 Read aloud";
    speakButton.onclick = () => speak(text);
    bubble.appendChild(speakButton);
  }

  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    setStatus("Speech output is not supported by this browser.");
    return;
  }

  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 1;
  window.speechSynthesis.speak(utterance);
}

voiceToggle.onclick = () => {
  voiceReplies = !voiceReplies;
  voiceToggle.textContent =
    voiceReplies ? "🔊 Voice replies: ON" : "🔇 Voice replies: OFF";
};

document.getElementById("stopVoice").onclick = () => {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
};

document.getElementById("clear").onclick = () => {
  if (busy) return;

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  history = [];
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="big">✦</div>
      <h2>Welcome to Rush AI</h2>
      <p>Ask me anything.<br>
      Type your question or tap the microphone to speak.</p>
    </div>`;
  setStatus("Chat cleared.");
};

async function sendMessage(textOverride) {
  const question = (textOverride ?? input.value).trim();
  if (!question || busy) return;

  input.value = "";
  input.style.height = "auto";
  addMessage("user", question);

  busy = true;
  sendButton.disabled = true;
  micButton.disabled = true;
  setStatus("Rush AI is thinking...");

  const pending = addMessage("ai", "Thinking...");

  try {
    // Send recent conversation so follow-up questions have context.
    const recent = history.slice(-8);
    const conversation = recent.map(item =>
      (item.role === "user" ? "User: " : "Rush AI: ") + item.text
    ).join("\n");

    const prompt =
      "You are Rush AI, a helpful and friendly AI assistant. " +
      "Answer clearly and naturally.\n\n" +
      (conversation ? conversation + "\n" : "") +
      "User: " + question + "\nRush AI:";

    // Prototype using your original Pollinations text endpoint.
    const url = API_BASE + encodeURIComponent(prompt);
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("AI service returned HTTP " + response.status);
    }

    const answer = (await response.text()).trim();

    if (!answer) throw new Error("The AI returned an empty response.");

    pending.remove();
    addMessage("ai", answer);

    history.push({ role: "user", text: question });
    history.push({ role: "assistant", text: answer });
    history = history.slice(-12);

    setStatus("Answer ready.");
    if (voiceReplies) speak(answer);

  } catch (error) {
    pending.remove();
    addMessage(
      "ai",
      "I couldn't connect to the AI service. Check your internet connection. " +
      "If the problem continues, the old Pollinations endpoint may require " +
      "updated API access or may not allow browser requests.\n\nDetails: " +
      error.message
    );
    setStatus("Connection failed.");
  } finally {
    busy = false;
    sendButton.disabled = false;
    micButton.disabled = false;
    input.focus();
  }
}

sendButton.onclick = () => sendMessage();

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

// Browser voice recognition: availability depends on the browser.
const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.continuous = false;

  micButton.onclick = () => {
    if (busy) return;
    try {
      recognition.start();
      micButton.textContent = "⏺";
      setStatus("Listening... Speak now.");
    } catch (error) {
      setStatus("Microphone is busy. Please try again.");
    }
  };

  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    input.dispatchEvent(new Event("input"));
    setStatus("Speech recognized. Tap ➤ to send.");
    input.focus();
  };

  recognition.onerror = event => {
    setStatus("Voice input error: " + event.error +
      ". Check microphone permission or try typing.");
  };

  recognition.onend = () => {
    micButton.textContent = "🎙️";
  };
} else {
  micButton.onclick = () => {
    setStatus(
      "Voice input isn't supported in this browser. " +
      "Try Chrome on Android or use keyboard voice typing."
    );
  };
}
</script>
</body>
</html>
